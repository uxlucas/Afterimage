name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # One platform failing should not hide how the others fare.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # core.autocrlf stays at the runner's default (true on Windows), so the byte-exact history is checked the way a Windows clone gets it.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # macOS runners use the Google Chrome they come with: with Chrome for Testing from setup-chrome, the first
      # e2e test there never finished. With CHROME_PATH empty the harness uses the installed Chrome.
      - id: chrome
        if: runner.os != 'macOS'
        uses: browser-actions/setup-chrome@v2
      # pretest:e2e builds the viewer and installs the examples first. The examples' copies link back to their installs, and
      # SvelteKit cannot build across drives, so the temp folder goes on the checkout's drive (D: on Windows runners, not C:).
      - run: npm run test:e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
